<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scyclone Benchmarks</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-Bold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* ColorPallete + plugin gradient accents */
      --bg: #111111;
      --surface: #1a1a1a;
      --surface-raised: #222222;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.13);
      --text: #ffffff;
      --text-label: #c4c9ce;
      --muted: #868686;
      --accent-pink: #eb1e79;
      --accent-magenta: #f02fc2;
      --accent-blue: #004e92;
      --accent-sky: #6094ea;
      --accent-cyan: #00ffe6;
      --accent-teal: #18a5a7;
      --gradient-brand: linear-gradient(135deg, var(--accent-magenta) 0%, var(--accent-sky) 100%);
      --gradient-subtle: linear-gradient(180deg, rgba(240, 47, 194, 0.06) 0%, rgba(96, 148, 234, 0.04) 100%);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      font-family: 'Inter', BlinkMacSystemFont, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: var(--bg);
      font-size: 16px;
    }

    body {
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      font-weight: 400;
      line-height: 1.5;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 255, 230, 0.07), transparent),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(240, 47, 194, 0.05), transparent),
        var(--bg);
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 40px;
    }

    /* Compact site header */
    .site-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      margin-top: 1px;
    }

    .header-text {
      flex: 1;
      min-width: 0;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 12px;
      margin-bottom: 4px;
    }

    .title-row h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .subtitle {
      margin: 0 0 6px;
      font-size: 0.9375rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .header-meta {
      margin: 0;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .header-meta a {
      color: var(--accent-sky);
    }

    .meta-sep {
      margin: 0 0.35em;
      opacity: 0.55;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-label);
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1.3;
    }

    .pill::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 5px rgba(0, 255, 230, 0.45);
    }

    .methodology-tip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      padding: 0;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--muted);
      cursor: help;
      line-height: 1.2;
    }

    .methodology-tip:hover {
      color: var(--text-label);
    }

    .methodology-tip .tip-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-label);
      line-height: 1;
    }

    a {
      color: var(--accent-sky);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    a:hover {
      color: var(--accent-cyan);
    }

    code {
      font-family: ui-monospace, 'Cascadia Code', 'Fira Mono', Consolas, monospace;
      font-size: 0.85em;
      color: var(--accent-cyan);
      background: rgba(0, 255, 230, 0.08);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }

    main {
      width: 100%;
    }

    .content-section {
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .content-section:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-bottom: 14px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-label);
      letter-spacing: 0.055em;
      text-transform: uppercase;
      line-height: 1.35;
    }

    /* Runner baseline - collapsed secondary content */
    .baseline-section {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .baseline-section>summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      user-select: none;
    }

    .baseline-section>summary::-webkit-details-marker {
      display: none;
    }

    .baseline-summary-text {
      flex: 1;
      min-width: 0;
    }

    .baseline-summary-text h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-label);
      letter-spacing: 0.04em;
      line-height: 1.35;
    }

    .baseline-summary-text p {
      display: none;
    }

    .baseline-summary-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .baseline-chevron {
      flex-shrink: 0;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.875rem;
      transition: transform 0.15s ease;
    }

    .baseline-section[open] .baseline-chevron {
      transform: rotate(90deg);
    }

    .baseline-body {
      padding: 0 16px 16px;
      border-top: 1px solid var(--border);
    }

    .baseline-intro {
      display: none;
    }

    .benchmark-graphs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 24px;
    }

    .benchmark-graphs-single {
      grid-template-columns: 1fr;
      max-width: 560px;
    }

    .kpi-panel {
      margin-bottom: 20px;
    }

    .overview-block {
      margin-bottom: 8px;
    }

    .kpi-panel-label {
      margin: 0 0 10px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.01em;
      line-height: 1.45;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
      gap: 10px;
      font-variant-numeric: tabular-nums;
    }

    .kpi-tile {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      padding: 12px 14px 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: default;
      transition: opacity 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .kpi-tile.metric-dimmed {
      opacity: 0.48;
    }

    .kpi-tile.metric-active {
      border-color: rgba(255, 255, 255, 0.16);
      background: var(--surface-raised);
    }

    .kpi-tile.metrics-alert {
      border-color: rgba(255, 143, 107, 0.42);
    }

    .kpi-swatch {
      display: block;
      height: 3px;
      width: calc(100% + 28px);
      margin: -12px -14px 2px;
      border-radius: 8px 8px 0 0;
      background: var(--kpi-color);
      flex-shrink: 0;
    }

    .kpi-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.35;
    }

    .kpi-tile.metric-active .kpi-label {
      color: var(--text-label);
    }

    .kpi-value {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    .kpi-delta {
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.2;
      margin-top: auto;
    }

    .kpi-delta.flat,
    .kpi-delta.noise,
    .kpi-delta.neutral {
      color: var(--muted);
      font-weight: 500;
    }

    .kpi-delta.notable.up {
      color: rgba(255, 143, 107, 0.8);
    }

    .kpi-delta.notable.down {
      color: rgba(94, 236, 192, 0.85);
    }

    .kpi-delta.up {
      color: #ff8f6b;
    }

    .kpi-delta.down {
      color: #5eecc0;
    }

    .runner-context {
      margin: 0;
      padding: 0 2px;
      font-size: 0.6875rem;
      color: var(--muted);
      line-height: 1.45;
      font-variant-numeric: tabular-nums;
    }

    .runner-context-item {
      white-space: nowrap;
    }

    .runner-context .kpi-delta {
      font-size: inherit;
    }

    .baseline-summary-drift {
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .baseline-summary-drift .kpi-delta {
      font-size: inherit;
    }

    .chart-block {
      position: relative;
      min-width: 0;
      transition: opacity 0.15s ease;
    }

    .chart-block.metric-dimmed {
      opacity: 0.42;
    }

    .chart-block .info-tip {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 1;
    }

    .info-tip {
      flex-shrink: 0;
      width: 14px;
      height: 14px;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: none;
      color: var(--muted);
      font-size: 0.625rem;
      font-weight: 600;
      line-height: 1;
      cursor: help;
      opacity: 0.55;
      transition: opacity 0.12s ease, color 0.12s ease;
    }

    .chart-block:hover .info-tip,
    .chart-block:focus-within .info-tip {
      opacity: 1;
    }

    .info-tip:hover {
      color: var(--text-label);
    }

    .benchmark-chart {
      display: block;
      max-width: 100%;
      height: auto;
    }

    /* Footer */
    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .footer-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 16px;
    }

    .torsion-lockup {
      display: inline-flex;
      align-items: center;
      opacity: 0.8;
      transition: opacity 0.15s ease;
    }

    .torsion-lockup:hover {
      opacity: 1;
    }

    .torsion-lockup img {
      display: block;
      height: 26px;
      width: auto;
    }

    button {
      font-family: inherit;
      color: var(--text-label);
      background: rgba(48, 48, 48, 0.5);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 500;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    button:hover {
      background: rgba(48, 48, 48, 0.85);
      border-color: rgba(255, 255, 255, 0.2);
      color: var(--text);
    }

    @media (max-width: 900px) {
      .benchmark-graphs {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 16px 14px 28px;
      }

      .site-header {
        gap: 10px;
      }

      .title-row h1 {
        font-size: 1.25rem;
      }

      .methodology-tip-label {
        display: none;
      }

      .benchmark-graphs {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <script>
    'use strict';
    (function () {
      const chartPalette = [
        '#EB1E79', '#00FFE6', '#6094EA', '#F02FC2', '#18A5A7',
        '#C82471', '#CCFFAA', '#004E92',
      ];

      const chartTheme = {
        grid: 'rgba(206, 206, 206, 0.12)',
        tick: '#868686',
        label: '#C4C9CE',
        tooltipBg: 'rgba(26, 26, 26, 0.95)',
        tooltipTitle: '#ffffff',
        tooltipBody: '#C4C9CE',
        tooltipBorder: 'rgba(255, 255, 255, 0.1)',
      };

      const benchMeta = {
        reference_cpu: {
          label: 'Reference CPU',
          summary: 'Synthetic FMA loop, CPU baseline.',
          tooltip: '1M fused-multiply-add operations per iteration. Not Scyclone code.',
          kind: 'sentinel',
        },
        reference_memory: {
          label: 'Reference Memory',
          summary: 'Synthetic ~1 MiB fill/read, memory baseline.',
          tooltip: 'Fills ~1 MiB and does strided reads each iteration. Not Scyclone code.',
          kind: 'sentinel',
        },
        processor_prepare: {
          label: 'Prepare',
          summary: 'Host prepare/release on an already-constructed processor.',
          tooltip: 'Fixture: processor created once. Each iteration calls prepareToPlay(44100, 512) then releaseResources(). ONNX models load at fixture setup, not per iteration.',
          kind: 'app',
        },
        processor: {
          label: 'Prepare',
          summary: 'Host prepare/release on an already-constructed processor.',
          tooltip: 'Legacy benchmark name (BM_processor). Same as Prepare: processor created once; each iteration calls prepareToPlay(44100, 512) then releaseResources().',
          kind: 'app',
        },
        process_block: {
          label: 'Process',
          summary: 'Stereo 512-sample audio callback, the real-time DSP path.',
          tooltip: 'Fixture: processor prepared at 44.1 kHz / 512 samples. Each iteration calls processBlock() with a cleared stereo buffer.',
          kind: 'app',
        },
        editor: {
          label: 'Editor',
          summary: 'UI open/close cost; catches heavier components or layout regressions.',
          tooltip: 'Fixture: processor created once. Each iteration creates and destroys the full editor (JUCE UI, OpenGL background). Headless CI, no real display.',
          kind: 'app',
        },
        compile_benchmark_target: {
          label: 'Compile',
          summary: 'Wall-clock Release build of the Benchmark executable and its dependencies.',
          tooltip: 'Measured once per CI run after a fresh configure. FetchContent deps may be cached; object files are not reused between runs.',
          kind: 'build',
        },
      };

      const appBenchOrder = ['processor_prepare', 'process_block', 'editor'];
      const buildBenchOrder = ['compile_benchmark_target'];
      const sentinelBenchOrder = ['reference_cpu', 'reference_memory'];

      const chartSync = (function createChartSync() {
        const chartEntries = [];
        const kpiEntries = [];
        let hoveredCommitId = null;
        let hoveredBenchName = null;
        let clearTimer = null;

        function commitIndex(dataset, commitId) {
          return dataset.findIndex(row => row.commit.id === commitId);
        }

        function dimColor(baseColor) {
          return baseColor.length === 7 ? baseColor + '35' : baseColor;
        }

        function applyChartEntry(entry) {
          const { chart, dataset, baseColor, block, benchName } = entry;
          const ds = chart.data.datasets[0];
          const n = dataset.length;
          const lastIndex = n - 1;
          const hasCommitHover = Boolean(hoveredCommitId);
          const matchIndex = hasCommitHover ? commitIndex(dataset, hoveredCommitId) : -1;
          const activeMetric = hoveredBenchName === benchName;
          const dimMetric = hoveredBenchName && !activeMetric;

          ds.borderColor = dimMetric ? dimColor(baseColor) : baseColor;

          ds.pointRadius = new Array(n);
          ds.pointHoverRadius = new Array(n);
          ds.pointBorderWidth = new Array(n);
          ds.pointBackgroundColor = new Array(n);
          ds.pointBorderColor = new Array(n);

          for (let i = 0; i < n; i++) {
            const isMatch = i === matchIndex;
            const dim = hasCommitHover && !isMatch;
            const isStart = !hasCommitHover && i === 0;
            const isEnd = !hasCommitHover && i === lastIndex;

            if (isMatch) {
              ds.pointRadius[i] = 7;
              ds.pointHoverRadius[i] = 9;
              ds.pointBorderWidth[i] = 2;
              ds.pointBackgroundColor[i] = '#ffffff';
              ds.pointBorderColor[i] = baseColor;
            } else if (dim) {
              ds.pointRadius[i] = 0;
              ds.pointHoverRadius[i] = 6;
              ds.pointBorderWidth[i] = 1;
              ds.pointBackgroundColor[i] = baseColor + '55';
              ds.pointBorderColor[i] = '#111111';
            } else if (isEnd) {
              ds.pointRadius[i] = 6;
              ds.pointHoverRadius[i] = 8;
              ds.pointBorderWidth[i] = 2;
              ds.pointBackgroundColor[i] = baseColor;
              ds.pointBorderColor[i] = '#ffffff';
            } else if (isStart && n > 1) {
              ds.pointRadius[i] = 4;
              ds.pointHoverRadius[i] = 7;
              ds.pointBorderWidth[i] = 2;
              ds.pointBackgroundColor[i] = baseColor;
              ds.pointBorderColor[i] = '#111111';
            } else {
              ds.pointRadius[i] = 0;
              ds.pointHoverRadius[i] = 7;
              ds.pointBorderWidth[i] = 1;
              ds.pointBackgroundColor[i] = baseColor;
              ds.pointBorderColor[i] = '#111111';
            }
          }

          if (block) {
            block.classList.toggle('metric-dimmed', dimMetric);
            block.classList.toggle('metric-active', activeMetric);
          }

          chart.update({ duration: 0 });
        }

        function applyKpiEntry(entry) {
          const { tile, benchName } = entry;
          const activeMetric = hoveredBenchName === benchName;
          const dimMetric = hoveredBenchName && !activeMetric;
          tile.classList.toggle('metric-active', activeMetric);
          tile.classList.toggle('metric-dimmed', dimMetric);
        }

        function refresh() {
          chartEntries.forEach(applyChartEntry);
          kpiEntries.forEach(applyKpiEntry);
        }

        function cancelClear() {
          if (clearTimer) {
            clearTimeout(clearTimer);
            clearTimer = null;
          }
        }

        function scheduleClear() {
          cancelClear();
          clearTimer = setTimeout(() => {
            hoveredCommitId = null;
            hoveredBenchName = null;
            refresh();
          }, 50);
        }

        function setMetricHover(benchName) {
          cancelClear();
          if (!benchName || hoveredBenchName === benchName) return;
          hoveredBenchName = benchName;
          refresh();
        }

        function setCommitHover(commitId) {
          cancelClear();
          if (!commitId || hoveredCommitId === commitId) return;
          hoveredCommitId = commitId;
          refresh();
        }

        function clearCommitHover() {
          if (!hoveredCommitId) return;
          hoveredCommitId = null;
          refresh();
        }

        function bindHoverTarget(el, onEnter) {
          el.addEventListener('mouseenter', () => {
            cancelClear();
            onEnter();
          });
          el.addEventListener('mouseleave', scheduleClear);
        }

        return {
          registerChart(entry) {
            chartEntries.push(entry);
            applyChartEntry(entry);
            bindHoverTarget(entry.block, () => setMetricHover(entry.benchName));
          },
          registerKpi(entry) {
            kpiEntries.push(entry);
            applyKpiEntry(entry);
            bindHoverTarget(entry.tile, () => setMetricHover(entry.benchName));
          },
          setCommitHover,
          clearCommitHover,
          clearAll() {
            cancelClear();
            hoveredCommitId = null;
            hoveredBenchName = null;
            refresh();
          },
        };
      })();

      function benchKey(raw) {
        const m = raw.match(/^BM_([^/]+)/);
        return m ? m[1] : raw;
      }

      function getBenchMeta(raw) {
        const key = benchKey(raw);
        const meta = benchMeta[key];
        if (meta) return meta;
        return {
          label: formatBenchName(raw),
          summary: '',
          tooltip: '',
          kind: 'app',
        };
      }

      function formatBenchName(raw) {
        const m = raw.match(/^BM_([^/]+)/);
        if (!m) return raw;
        return m[1]
          .replace(/_/g, ' ')
          .replace(/\b\w/g, c => c.toUpperCase());
      }

      const deltaFlatThresholdPct = 0.05;
      const deltaNoiseBandPct = 3;
      const deltaAlertThresholdPct = 5;

      function classifyDeltaMagnitude(pct) {
        const abs = Math.abs(pct);
        if (abs < deltaFlatThresholdPct) return 'flat';
        if (abs < deltaNoiseBandPct) return 'noise';
        if (abs < deltaAlertThresholdPct) return 'notable';
        return 'alert';
      }

      function enrichDelta(delta) {
        if (!delta) return null;
        return {
          ...delta,
          magnitude: classifyDeltaMagnitude(delta.pct),
        };
      }

      function maxRunnerDriftPct(sentinelBenches) {
        let max = 0;
        for (const [, data] of sentinelBenches) {
          const d = computeVsPreviousDelta(data);
          if (d && d.tone !== 'flat') {
            max = Math.max(max, Math.abs(d.pct));
          }
        }
        return max;
      }

      function appVsRunnerNote(delta, maxRunnerDrift) {
        if (!delta || delta.tone === 'flat' || delta.magnitude === 'noise') return '';
        if (!Number.isFinite(maxRunnerDrift)) return '';
        const appAbs = Math.abs(delta.pct);
        if (appAbs > maxRunnerDrift + 3) {
          return ' Larger than runner drift — more likely a Scyclone change.';
        }
        if (appAbs <= maxRunnerDrift + 1) {
          return ' Similar to runner drift — may be shared CI noise.';
        }
        return '';
      }

      function shortSentinelLabel(meta) {
        return meta.label.replace(/^Reference\s+/i, '');
      }

      function formatBenchValue(valueNs) {
        if (!Number.isFinite(valueNs)) return null;
        const abs = Math.abs(valueNs);
        if (abs >= 1e9) return (valueNs / 1e9).toFixed(2) + ' s';
        if (abs >= 1e6) return (valueNs / 1e6).toFixed(1) + ' ms';
        if (abs >= 1e3) return (valueNs / 1e3).toFixed(1) + ' µs';
        return valueNs.toFixed(0) + ' ns';
      }

      function formatCompactBenchValue(valueNs, meta) {
        if (!Number.isFinite(valueNs)) return 'n/a';
        const abs = Math.abs(valueNs);
        if (meta.kind === 'build') {
          if (abs >= 1e9) return (valueNs / 1e9).toFixed(abs >= 10e9 ? 0 : 1) + 's';
        }
        if (abs >= 1e9) return (valueNs / 1e9).toFixed(1) + 's';
        if (abs >= 1e6) return (valueNs / 1e6).toFixed(abs >= 10e6 ? 0 : 1) + 'ms';
        if (abs >= 1e3) return (valueNs / 1e3).toFixed(0) + 'µs';
        return valueNs.toFixed(0) + 'ns';
      }

      /** Google Benchmark reports cpu_time in ns/iter; charts use ms for runtime, seconds for build. */
      function benchValueToChart(meta, valueNs) {
        if (meta.kind === 'build') return valueNs / 1e9;
        return valueNs / 1e6;
      }

      function chartYAxisLabel(meta, rawUnit) {
        if (meta.kind === 'build') return 's';
        return rawUnit === 'ns/iter' ? 'ms/iter' : (rawUnit || '');
      }

      function formatAxisMs(valueMs) {
        if (!Number.isFinite(valueMs)) return '';
        const abs = Math.abs(valueMs);
        if (abs >= 100) return valueMs.toFixed(0);
        if (abs >= 10) return valueMs.toFixed(1);
        if (abs >= 1) return valueMs.toFixed(1);
        return valueMs.toFixed(2);
      }

      function formatAxisSeconds(valueSec) {
        if (!Number.isFinite(valueSec)) return '';
        const abs = Math.abs(valueSec);
        if (abs >= 100) return valueSec.toFixed(0);
        if (abs >= 10) return valueSec.toFixed(1);
        return valueSec.toFixed(2);
      }

      function computeVsPreviousDelta(dataset) {
        if (!dataset || dataset.length < 2) return null;
        const previous = dataset[dataset.length - 2].bench.value;
        const latest = dataset[dataset.length - 1].bench.value;
        if (!Number.isFinite(previous) || !Number.isFinite(latest) || previous === 0) return null;
        const pct = ((latest - previous) / previous) * 100;
        return {
          pct,
          latest,
          tone: Math.abs(pct) < 0.05 ? 'flat' : pct > 0 ? 'slower' : 'faster',
        };
      }

      function deltaTooltipText(delta, kind, latestLabel, runnerNote = '') {
        if (!delta) return 'No previous commit to compare against yet.';
        const pctLabel = delta.tone === 'flat'
          ? 'about the same as previous commit'
          : Math.abs(delta.pct).toFixed(1) + '% ' + (delta.tone === 'slower' ? 'higher' : 'lower') + ' than previous commit';
        const prefix = latestLabel ? latestLabel + ': ' : '';
        if (kind === 'sentinel') {
          return prefix + pctLabel + '. Synthetic host check — not Scyclone code. Use to interpret app deltas.';
        }
        let text = prefix + pctLabel;
        if (delta.magnitude === 'noise') {
          text += ' (within typical CI noise band)';
        } else if (delta.magnitude === 'notable') {
          text += ' (moderate change)';
        } else if (delta.magnitude === 'alert') {
          text += ' (large change — worth investigating)';
        }
        return text + runnerNote;
      }

      function createDeltaChangeSpan(delta, baseClass = 'metric-delta', { neutral = false } = {}) {
        const change = document.createElement('span');
        if (!delta) {
          change.className = baseClass + ' flat';
          change.textContent = '—';
          return change;
        }
        if (delta.tone === 'flat') {
          change.className = baseClass + ' flat';
          change.textContent = '~0%';
          return change;
        }

        const magnitude = delta.magnitude ?? classifyDeltaMagnitude(delta.pct);
        const worse = delta.tone === 'slower';
        const classes = [baseClass];

        if (neutral) {
          classes.push('neutral');
        } else if (magnitude === 'noise') {
          classes.push('noise');
        } else if (magnitude === 'notable') {
          classes.push('notable', worse ? 'up' : 'down');
        } else {
          classes.push(worse ? 'up' : 'down');
        }

        change.className = classes.join(' ');
        change.textContent = (worse ? '↗' : '↘') + ' ' + Math.abs(delta.pct).toFixed(1) + '%';
        return change;
      }

      function createKpiTile(benchName, dataset, colorIndex, { runnerDriftMax = 0 } = {}) {
        const meta = getBenchMeta(benchName);
        const delta = enrichDelta(computeVsPreviousDelta(dataset));
        const latest = dataset.length > 0 ? dataset[dataset.length - 1].bench.value : null;
        const latestLabel = formatBenchValue(delta?.latest ?? latest);
        const color = chartPalette[colorIndex % chartPalette.length];
        const runnerNote = meta.kind === 'app' ? appVsRunnerNote(delta, runnerDriftMax) : '';

        const tile = document.createElement('div');
        tile.className = 'kpi-tile';
        tile.title = deltaTooltipText(delta, meta.kind, latestLabel, runnerNote);
        tile.style.setProperty('--kpi-color', color);

        const swatch = document.createElement('span');
        swatch.className = 'kpi-swatch';
        swatch.setAttribute('aria-hidden', 'true');
        tile.appendChild(swatch);

        const label = document.createElement('span');
        label.className = 'kpi-label';
        label.textContent = meta.label;
        tile.appendChild(label);

        const value = document.createElement('span');
        value.className = 'kpi-value';
        value.textContent = formatCompactBenchValue(delta?.latest ?? latest, meta);
        tile.appendChild(value);

        const change = createDeltaChangeSpan(
          delta,
          'kpi-delta',
          { neutral: meta.kind === 'sentinel' },
        );
        if (delta && delta.magnitude === 'alert' && meta.kind !== 'sentinel') {
          tile.classList.add('metrics-alert');
        }
        tile.appendChild(change);

        chartSync.registerKpi({ tile, benchName });

        return { tile, color };
      }

      function createKpiPanel(benches, startColorIndex, { runnerDriftMax = 0, panelLabel = 'Latest vs previous develop push' } = {}) {
        const panel = document.createElement('div');
        panel.className = 'kpi-panel';

        const label = document.createElement('p');
        label.className = 'kpi-panel-label';
        label.textContent = panelLabel;
        panel.appendChild(label);

        const grid = document.createElement('div');
        grid.className = 'kpi-grid';
        grid.setAttribute('aria-label', 'Latest benchmark summary');
        panel.appendChild(grid);

        const colors = new Map();
        let colorIndex = startColorIndex;
        for (const [benchName, data] of benches) {
          const { tile, color } = createKpiTile(benchName, data, colorIndex++, { runnerDriftMax });
          colors.set(benchName, color);
          grid.appendChild(tile);
        }

        return { panel, colors, nextColorIndex: colorIndex };
      }

      function createRunnerContextStrip(sentinelBenches) {
        const line = document.createElement('p');
        line.className = 'runner-context';
        line.title =
          'Synthetic host benchmarks on the same CI runner. ' +
          'If app metrics move by a similar amount, the change may be runner noise rather than Scyclone.';

        line.appendChild(document.createTextNode('Runner drift '));

        sentinelBenches.forEach(([benchName, data], index) => {
          if (index > 0) {
            line.appendChild(document.createTextNode(' · '));
          }
          const meta = getBenchMeta(benchName);
          const delta = enrichDelta(computeVsPreviousDelta(data));
          const item = document.createElement('span');
          item.className = 'runner-context-item';
          item.appendChild(document.createTextNode(shortSentinelLabel(meta) + ' '));
          item.appendChild(createDeltaChangeSpan(delta, 'kpi-delta', { neutral: true }));
          line.appendChild(item);
        });

        return line;
      }

      function createBaselineSummaryDrift(sentinelBenches) {
        const wrap = document.createElement('span');
        wrap.className = 'baseline-summary-drift';

        sentinelBenches.forEach(([benchName, data], index) => {
          if (index > 0) {
            wrap.appendChild(document.createTextNode(' · '));
          }
          const meta = getBenchMeta(benchName);
          const delta = enrichDelta(computeVsPreviousDelta(data));
          wrap.appendChild(document.createTextNode(shortSentinelLabel(meta) + ' '));
          wrap.appendChild(createDeltaChangeSpan(delta, 'kpi-delta', { neutral: true }));
        });

        return wrap;
      }

      function createSectionHeader(title) {
        const header = document.createElement('div');
        header.className = 'section-header';
        const heading = document.createElement('h2');
        heading.textContent = title;
        header.appendChild(heading);
        return header;
      }

      function collectBenchesPerTestCase(entries) {
        const map = new Map();
        for (const entry of entries) {
          const { commit, date, tool, benches } = entry;
          for (const bench of benches) {
            const result = { commit, date, tool, bench };
            const arr = map.get(bench.name);
            if (arr === undefined) map.set(bench.name, [result]);
            else arr.push(result);
          }
        }
        return map;
      }

      function init() {
        const data = window.BENCHMARK_DATA;
        const methodologyTip = document.getElementById('methodology-tip');
        methodologyTip.title =
          'Prepare, process, and editor benchmarks on macOS arm64 CI (44.1 kHz, 512 samples). ' +
          'Each runtime point is the mean of five repetitions. ' +
          'Compile time is wall-clock Release build of the Benchmark target.';

        document.getElementById('last-update').textContent =
          new Date(data.lastUpdate).toLocaleString(undefined, {
            day: 'numeric',
            month: 'short',
            year: 'numeric',
          });
        const repoLink = document.getElementById('repository-link');
        repoLink.href = data.repoUrl;
        repoLink.textContent = 'Repository';

        document.getElementById('dl-button').onclick = () => {
          const a = document.createElement('a');
          a.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(data, null, 2));
          a.download = 'benchmark_data.json';
          a.click();
        };

        return Object.keys(data.entries).map(name => ({
          name,
          dataSet: collectBenchesPerTestCase(data.entries[name]),
        }));
      }

      function sortBenches(entries, order) {
        return [...entries].sort((a, b) => {
          const ia = order.indexOf(benchKey(a[0]));
          const ib = order.indexOf(benchKey(b[0]));
          const ai = ia === -1 ? order.length : ia;
          const bi = ib === -1 ? order.length : ib;
          return ai - bi;
        });
      }

      function partitionBenches(benchSet) {
        const app = [];
        const build = [];
        const sentinel = [];
        for (const entry of benchSet.entries()) {
          const kind = getBenchMeta(entry[0]).kind;
          if (kind === 'sentinel') sentinel.push(entry);
          else if (kind === 'build') build.push(entry);
          else app.push(entry);
        }
        return {
          app: sortBenches(app, appBenchOrder),
          build: sortBenches(build, buildBenchOrder),
          sentinel: sortBenches(sentinel, sentinelBenchOrder),
        };
      }

      function createChartBlock(name, color) {
        const meta = getBenchMeta(name);
        const block = document.createElement('div');
        block.className = 'chart-block';
        block.setAttribute('aria-label', meta.label + ' trend');

        if (meta.tooltip) {
          const tip = document.createElement('button');
          tip.type = 'button';
          tip.className = 'info-tip';
          tip.textContent = '?';
          tip.title = meta.tooltip;
          tip.setAttribute('aria-label', meta.label + ': ' + meta.tooltip);
          block.appendChild(tip);
        }

        const canvas = document.createElement('canvas');
        canvas.className = 'benchmark-chart';
        block.appendChild(canvas);

        return { block, canvas, meta };
      }

      function mergeOverviewBenches(app, build) {
        return sortBenches([...app, ...build], [...appBenchOrder, ...buildBenchOrder]);
      }

      function initChart(canvas, meta, dataset, color, block, benchName) {
        const yUnit = chartYAxisLabel(meta, dataset.length > 0 ? dataset[0].bench.unit : '');
        const chartData = {
          labels: dataset.map(d => d.commit.id.slice(0, 7)),
          datasets: [{
            label: meta.label,
            data: dataset.map(d => benchValueToChart(meta, d.bench.value)),
            borderColor: color,
            backgroundColor: 'transparent',
            borderWidth: 2.5,
            pointBackgroundColor: color,
            pointBorderColor: '#111111',
            pointBorderWidth: 1,
            pointRadius: 0,
            pointHoverRadius: 7,
            fill: false,
            lineTension: 0.15,
          }],
        };

        const chart = new Chart(canvas, {
          type: 'line',
          data: chartData,
          options: {
            legend: { display: false },
            maintainAspectRatio: true,
            aspectRatio: 2.35,
            elements: {
              point: { hitRadius: 12 },
              line: { borderJoinStyle: 'round' },
            },
            hover: {
              mode: 'index',
              intersect: false,
              animationDuration: 0,
            },
            scales: {
              xAxes: [{
                gridLines: { color: chartTheme.grid, zeroLineColor: chartTheme.grid },
                ticks: { fontColor: chartTheme.tick, fontFamily: 'Inter', fontSize: 11 },
              }],
              yAxes: [{
                gridLines: { color: chartTheme.grid, zeroLineColor: chartTheme.grid },
                ticks: {
                  fontColor: chartTheme.tick,
                  fontFamily: 'Inter',
                  fontSize: 11,
                  beginAtZero: true,
                  callback: value => meta.kind === 'build'
                    ? formatAxisSeconds(value)
                    : formatAxisMs(value),
                },
                scaleLabel: {
                  display: true,
                  labelString: yUnit,
                  fontColor: chartTheme.label,
                  fontFamily: 'Inter',
                  fontSize: 11,
                },
              }],
            },
            tooltips: {
              mode: 'index',
              intersect: false,
              backgroundColor: chartTheme.tooltipBg,
              titleFontFamily: 'Inter',
              bodyFontFamily: 'Inter',
              titleFontColor: chartTheme.tooltipTitle,
              bodyFontColor: chartTheme.tooltipBody,
              borderColor: chartTheme.tooltipBorder,
              borderWidth: 1,
              cornerRadius: 6,
              xPadding: 12,
              yPadding: 10,
              callbacks: {
                afterTitle(items) {
                  const { index } = items[0];
                  const row = dataset[index];
                  const user = row.commit.committer && row.commit.committer.username
                    ? '@' + row.commit.committer.username
                    : '';
                  return '\n' + row.commit.message + '\n\n' + row.commit.timestamp + ' ' + user + '\n';
                },
                label(item) {
                  const { value, range } = dataset[item.index].bench;
                  let label = formatBenchValue(value) || String(item.yLabel);
                  if (range) label += ' (' + range + ')';
                  return label;
                },
              },
            },
            onClick(_evt, active) {
              if (active.length === 0) return;
              const url = dataset[active[0]._index].commit.url;
              if (url) window.open(url, '_blank');
            },
            onHover(_evt, active) {
              if (active.length > 0) {
                chartSync.setCommitHover(dataset[active[0]._index].commit.id);
              } else {
                chartSync.clearCommitHover();
              }
            },
          },
        });

        chartSync.registerChart({ chart, dataset, baseColor: color, block, benchName });
        return chart;
      }

      function renderGraphs(parent, benches, startColorIndex, colorMap = null) {
        let colorIndex = startColorIndex;
        for (const [benchName, data] of benches) {
          const color = colorMap?.get(benchName) ?? chartPalette[colorIndex % chartPalette.length];
          const { block, canvas, meta } = createChartBlock(benchName, color);
          parent.appendChild(block);
          initChart(canvas, meta, data, color, block, benchName);
          colorIndex++;
        }
        return colorIndex;
      }

      function renderBenchSet(benchSet, main) {
        const { app, build, sentinel } = partitionBenches(benchSet);
        let colorIndex = 0;
        const runnerDriftMax = sentinel.length > 0 ? maxRunnerDriftPct(sentinel) : 0;
        const overview = mergeOverviewBenches(app, build);
        let sharedColors = new Map();

        if (overview.length > 0) {
          const overviewBlock = document.createElement('div');
          overviewBlock.className = 'overview-block';
          main.appendChild(overviewBlock);

          const { panel, colors, nextColorIndex } = createKpiPanel(overview, colorIndex, { runnerDriftMax });
          overviewBlock.appendChild(panel);
          if (sentinel.length > 0) {
            overviewBlock.appendChild(createRunnerContextStrip(sentinel));
          }
          sharedColors = colors;
          colorIndex = nextColorIndex;
        }

        if (app.length > 0) {
          const section = document.createElement('section');
          section.className = 'content-section';
          main.appendChild(section);
          section.appendChild(createSectionHeader('Performance'));

          const graphsElem = document.createElement('div');
          graphsElem.className = 'benchmark-graphs';
          section.appendChild(graphsElem);
          colorIndex = renderGraphs(graphsElem, app, colorIndex - overview.length, sharedColors);
        }

        if (build.length > 0) {
          const section = document.createElement('section');
          section.className = 'content-section';
          main.appendChild(section);
          section.appendChild(createSectionHeader('Compile'));

          const graphsElem = document.createElement('div');
          graphsElem.className = 'benchmark-graphs benchmark-graphs-single';
          section.appendChild(graphsElem);
          colorIndex = renderGraphs(graphsElem, build, colorIndex - build.length, sharedColors);
        }

        if (sentinel.length > 0) {
          const details = document.createElement('details');
          details.className = 'content-section baseline-section';

          const summary = document.createElement('summary');
          const summaryTitle = document.createElement('div');
          summaryTitle.className = 'baseline-summary-text';
          summaryTitle.innerHTML = '<h2>Runner baseline</h2>';
          summary.appendChild(summaryTitle);

          const summaryActions = document.createElement('div');
          summaryActions.className = 'baseline-summary-actions';
          summaryActions.appendChild(createBaselineSummaryDrift(sentinel));
          const chevron = document.createElement('span');
          chevron.className = 'baseline-chevron';
          chevron.setAttribute('aria-hidden', 'true');
          chevron.textContent = '▸';
          summaryActions.appendChild(chevron);
          summary.appendChild(summaryActions);
          details.appendChild(summary);

          const body = document.createElement('div');
          body.className = 'baseline-body';
          details.appendChild(body);

          const { panel, colors } = createKpiPanel(sentinel, 0, {
            panelLabel: 'Synthetic host checks — compare drift to Scyclone metrics above',
          });
          body.appendChild(panel);

          const graphsElem = document.createElement('div');
          graphsElem.className = 'benchmark-graphs';
          body.appendChild(graphsElem);

          const pending = sentinel.map(([benchName, data]) => {
            const color = colors.get(benchName);
            const { block, canvas, meta } = createChartBlock(benchName, color);
            graphsElem.appendChild(block);
            return { block, canvas, meta, data };
          });

          let baselineReady = false;
          function drawBaselineCharts() {
            if (baselineReady) return;
            baselineReady = true;
            pending.forEach((item, index) => {
              const [benchName] = sentinel[index];
              const color = colors.get(benchName);
              initChart(item.canvas, item.meta, item.data, color, item.block, benchName);
            });
          }

          details.addEventListener('toggle', () => {
            if (details.open) drawBaselineCharts();
          });

          main.appendChild(details);
        }
      }

      const main = document.getElementById('main');
      main.addEventListener('mouseleave', () => chartSync.clearAll());
      for (const { dataSet } of init()) {
        renderBenchSet(dataSet, main);
      }
    })();
  </script>
</body>

</html>
