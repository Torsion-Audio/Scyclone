<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scyclone Benchmarks</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-Bold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #090909;
      --surface: rgba(255, 255, 255, 0.045);
      --surface-raised: rgba(255, 255, 255, 0.075);
      --border: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.11);
      --text: #f5f5f7;
      --text-label: rgba(255, 255, 255, 0.78);
      --muted: rgba(255, 255, 255, 0.45);
      --accent-pink: #eb1e79;
      --accent-magenta: #f02fc2;
      --accent-blue: #004e92;
      --accent-sky: #7eb0ff;
      --accent-cyan: #7ae8dc;
      --accent-teal: #18a5a7;
      --kpi-worse: #eeaa55;
      --kpi-worse-soft: rgba(238, 170, 85, 0.9);
      --kpi-better: #55ccee;
      --kpi-better-soft: rgba(85, 204, 238, 0.9);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --ease-out: cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      font-family: 'Inter', BlinkMacSystemFont, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: var(--bg);
      font-size: 16px;
    }

    body {
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      font-weight: 400;
      line-height: 1.5;
      background:
        radial-gradient(ellipse 100% 80% at 50% -30%, rgba(255, 255, 255, 0.04), transparent 55%),
        var(--bg);
    }

    .page {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 32px clamp(24px, 3vw, 48px) 56px;
    }

    /* Site header */
    .site-header {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      margin-bottom: 36px;
      padding-bottom: 0;
    }

    .logo {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      margin-top: 0.15rem;
    }

    .header-body {
      flex: 1;
      min-width: 0;
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .header-top h1 {
      margin: 0;
      font-size: 1.625rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      text-transform: none;
      line-height: 1.12;
      color: var(--text);
      min-width: 0;
    }

    .header-page {
      font-size: 0.62em;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: -0.01em;
      vertical-align: baseline;
    }

    .meta-sep {
      opacity: 0.35;
      user-select: none;
    }

    .header-help {
      flex-shrink: 0;
      margin-top: 0.15rem;
      opacity: 0.85;
      transition: opacity 0.2s var(--ease-out), color 0.2s var(--ease-out), background 0.2s var(--ease-out);
    }

    .header-help:hover,
    .header-help:focus-visible {
      opacity: 1;
    }

    a {
      color: var(--text-label);
      text-decoration: none;
      transition: color 0.2s var(--ease-out);
    }

    a:hover {
      color: var(--text);
    }

    code {
      font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace;
      font-size: 0.85em;
      color: var(--text-label);
      background: rgba(255, 255, 255, 0.06);
      padding: 0.12em 0.4em;
      border-radius: 6px;
    }

    main {
      width: 100%;
    }

    .content-section {
      margin-bottom: 44px;
      padding-bottom: 0;
      border-bottom: none;
    }

    .content-section:last-child {
      margin-bottom: 0;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 20px;
      margin-bottom: 18px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.35;
    }

    /* Runner baseline */
    .baseline-section {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      margin-bottom: 0;
      padding-bottom: 0;
      overflow: hidden;
      transition: background 0.2s var(--ease-out);
    }

    .baseline-section>summary {
      list-style: none;
      cursor: pointer;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      user-select: none;
      transition: background 0.2s var(--ease-out);
    }

    .baseline-section>summary:hover {
      background: var(--surface-raised);
    }

    .baseline-section>summary::-webkit-details-marker {
      display: none;
    }

    .baseline-summary-text {
      flex: 1;
      min-width: 0;
    }

    .baseline-summary-text h2 {
      margin: 0;
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-label);
      letter-spacing: -0.01em;
      line-height: 1.35;
    }

    .baseline-summary-text p {
      display: none;
    }

    .baseline-summary-text .baseline-runner-env {
      display: block;
      margin: 4px 0 0;
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.4;
      letter-spacing: 0.01em;
    }

    .baseline-summary-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .baseline-chevron {
      flex-shrink: 0;
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.875rem;
      transition: transform 0.15s ease;
    }

    .baseline-section[open] .baseline-chevron {
      transform: rotate(90deg);
    }

    .baseline-body {
      padding: 0 18px 18px;
      border-top: 1px solid var(--border);
    }

    .benchmark-graphs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px 32px;
    }

    @media (min-width: 1024px) {
      .content-section:not(.baseline-section) .benchmark-graphs {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .kpi-panel {
      margin-bottom: 20px;
    }

    .overview-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1 1 auto;
      margin-bottom: 0;
      width: 100%;
      max-width: 100%;
      padding-block: clamp(0.5rem, 2vh, 1.25rem);
    }

    .overview-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 44rem;
      margin-inline: auto;
    }

    .overview-metrics {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.875rem;
      width: 100%;
      min-width: 0;
    }

    .overview-lead-sep {
      opacity: 0.35;
      user-select: none;
    }

    .overview-lead-verdict {
      font-weight: 600;
      color: var(--text-label);
      cursor: help;
      text-decoration: underline transparent;
      text-underline-offset: 2px;
      transition: text-decoration-color 0.2s var(--ease-out);
    }

    .overview-lead-verdict:hover,
    .overview-lead-verdict:focus-visible {
      text-decoration-color: rgba(255, 255, 255, 0.28);
    }

    .runner-context-label {
      cursor: help;
      text-decoration: underline transparent;
      text-underline-offset: 2px;
      transition: text-decoration-color 0.2s var(--ease-out);
    }

    .runner-context-label:hover,
    .runner-context-label:focus-visible {
      text-decoration-color: rgba(255, 255, 255, 0.22);
    }

    .overview-lead-verdict--ok {
      color: var(--kpi-better-soft);
    }

    .overview-lead-verdict--alert {
      color: var(--kpi-worse-soft);
    }

    .overview-lead-verdict--watch {
      color: var(--text-label);
    }

    .overview-lead-verdict--neutral {
      color: var(--muted);
      font-weight: 500;
    }

    .overview-block .kpi-panel {
      margin-bottom: 0;
      width: 100%;
      padding-block: clamp(1.75rem, 7vh, 3.25rem) 0;
    }

    .kpi-strip-card {
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: visible;
    }

    .fold-primary {
      min-height: 100dvh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .fold-primary>.content-section {
      flex: 0 0 auto;
      margin-top: auto;
      margin-bottom: 0;
      width: 100%;
      padding-top: clamp(1.5rem, 4vh, 2.75rem);
    }

    .content-section--build {
      scroll-margin-top: 24px;
    }

    .content-section--build .section-header {
      margin-bottom: 14px;
    }

    .build-summary-delta {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .build-summary-delta .kpi-delta {
      font-size: inherit;
    }

    .kpi-panel-label {
      margin: 0 0 10px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.01em;
      line-height: 1.45;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      font-variant-numeric: tabular-nums;
    }

    .kpi-strip {
      --kpi-row-label: 1.125rem;
      --kpi-row-value: 1.75rem;
      --kpi-row-delta: 1.125rem;
      display: grid;
      width: 100%;
      max-width: none;
      margin: 0;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 0;
      row-gap: 0;
      font-variant-numeric: tabular-nums;
    }

    .kpi-strip--grouped .kpi-col-build {
      grid-column: auto;
      border-inline-start: 1px solid rgba(255, 255, 255, 0.06);
      border-top: none;
      margin-top: 0;
      padding-top: 0;
      max-width: none;
      justify-self: stretch;
    }

    .kpi-col-build .kpi-col-foot .kpi-label {
      color: var(--muted);
      opacity: 0.8;
    }

    .kpi-col-build .kpi-col-num {
      font-size: 1.0625rem;
      font-weight: 500;
      color: var(--text-label);
    }

    .kpi-col-build .kpi-col-unit {
      opacity: 0.75;
    }

    .kpi-col-build .kpi-col-delta {
      font-size: 0.75rem;
      font-weight: 500;
    }

    .kpi-col-build .kpi-col-delta.up,
    .kpi-col-build .kpi-col-delta.notable.up {
      color: var(--kpi-worse-soft);
      opacity: 0.85;
    }

    .kpi-col-build .kpi-col-delta.down,
    .kpi-col-build .kpi-col-delta.notable.down {
      color: var(--kpi-better-soft);
      opacity: 0.85;
    }

    .kpi-col-build.metrics-alert .kpi-col-delta.up,
    .kpi-col-build.metrics-alert .kpi-col-delta.notable.up {
      font-weight: 600;
    }

    .kpi-col {
      position: relative;
      display: grid;
      grid-template-rows:
        var(--kpi-row-label) var(--kpi-row-value) var(--kpi-row-delta);
      align-items: center;
      justify-items: center;
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      min-height: 0;
      padding: 0 0.75rem;
      border-inline-start: none;
      background: transparent;
      cursor: pointer;
      transition: opacity 0.2s var(--ease-out), color 0.2s var(--ease-out);
    }

    .kpi-col::before {
      display: none;
    }

    .kpi-col:hover {
      background: transparent;
    }

    .kpi-col>.kpi-col-foot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 0;
      margin: 0;
      align-self: end;
    }

    .kpi-col>.kpi-col-value {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      margin: 0;
      line-height: 1;
    }

    .kpi-col>.kpi-col-delta {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      margin: 0;
      width: 100%;
    }

    .kpi-col:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.28);
      outline-offset: 4px;
      border-radius: 6px;
    }

    .kpi-col.metric-dimmed {
      opacity: 0.4;
    }

    .kpi-col.metric-active .kpi-col-foot .kpi-label {
      color: var(--text);
    }

    .kpi-col.metrics-alert .kpi-col-delta.up,
    .kpi-col.metrics-alert .kpi-col-delta.notable.up {
      font-weight: 700;
    }

    .kpi-col-rank-primary .kpi-label {
      color: var(--text);
      font-weight: 600;
    }

    .kpi-col-foot {
      min-width: 0;
    }

    .kpi-col-foot .kpi-label {
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--muted);
      text-align: center;
      line-height: 1.2;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .kpi-col-value {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      line-height: 1;
      width: 100%;
    }

    .kpi-col-num {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .kpi-col-unit {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--muted);
      margin-left: 2px;
      letter-spacing: 0;
      opacity: 0.9;
      line-height: 1.2;
    }

    .kpi-col-delta {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 0;
      font-size: 0.8125rem;
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .kpi-col-delta.flat,
    .kpi-col-delta.noise,
    .kpi-col-delta.neutral {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.8125rem;
    }

    .kpi-col-delta.notable.up {
      color: var(--kpi-worse-soft);
    }

    .kpi-col-delta.notable.down {
      color: var(--kpi-better-soft);
    }

    .kpi-col-delta.up {
      color: var(--kpi-worse);
    }

    .kpi-col-delta.down {
      color: var(--kpi-better);
    }

    .kpi-tile {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
      min-height: 0;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .kpi-tile:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.28);
      outline-offset: 4px;
      border-radius: 6px;
    }

    .kpi-tile.metric-dimmed {
      opacity: 0.48;
    }

    .kpi-tile.metric-active .kpi-label {
      color: var(--text);
    }

    .kpi-tile.metrics-alert .kpi-delta.up,
    .kpi-tile.metrics-alert .kpi-delta.notable.up {
      font-weight: 700;
    }

    .kpi-head {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .kpi-label {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-label);
      letter-spacing: 0.01em;
      line-height: 1.3;
      min-width: 0;
    }

    .kpi-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-top: auto;
    }

    .kpi-value {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.2;
      letter-spacing: 0;
      text-align: center;
    }

    .kpi-delta {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      text-align: center;
      white-space: nowrap;
    }

    .kpi-delta.flat,
    .kpi-delta.noise,
    .kpi-delta.neutral {
      color: var(--muted);
      font-weight: 600;
      font-size: 1.0625rem;
    }

    .kpi-delta.notable.up {
      color: var(--kpi-worse-soft);
    }

    .kpi-delta.notable.down {
      color: var(--kpi-better-soft);
    }

    .kpi-delta.up {
      color: var(--kpi-worse);
    }

    .kpi-delta.down {
      color: var(--kpi-better);
    }

    .runner-context {
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      font-size: 0.6875rem;
      color: var(--muted);
      line-height: 1.45;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .overview-metrics .runner-context {
      padding-top: 0.25rem;
    }

    .runner-context .kpi-delta {
      font-size: inherit;
    }

    .runner-context .overview-lead-verdict {
      font-size: inherit;
    }

    .runner-context .overview-lead-sep {
      opacity: 0.35;
    }

    .baseline-summary-drift {
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .baseline-summary-drift .kpi-delta {
      font-size: inherit;
    }

    .chart-header {
      margin-bottom: 10px;
    }

    .chart-title-row {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .chart-label {
      margin: 0;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-label);
      letter-spacing: -0.01em;
      line-height: 1.3;
      transition: color 0.2s var(--ease-out);
    }

    .chart-block.metric-active .chart-label {
      color: var(--text);
    }

    .chart-block {
      position: relative;
      min-width: 0;
      min-height: 280px;
      contain: layout style;
      transition: opacity 0.2s var(--ease-out);
      scroll-margin-top: 20px;
      scroll-margin-bottom: 12px;
    }

    .benchmark-chart {
      display: block;
      width: 100% !important;
      max-width: 100%;
      height: auto !important;
    }

    .chart-block.metric-dimmed {
      opacity: 0.35;
    }

    .chart-title-row .info-tip {
      margin-left: 3px;
    }

    .info-tip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      min-width: 22px;
      min-height: 22px;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 0.6875rem;
      font-weight: 600;
      line-height: 1;
      cursor: help;
      opacity: 0.75;
      transition: opacity 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    .info-tip:hover,
    .info-tip:focus-visible {
      opacity: 1;
      color: var(--text-label);
      background: rgba(255, 255, 255, 0.11);
      outline: none;
    }

    .info-tip:focus-visible {
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.22);
    }

    .app-tooltip {
      position: fixed;
      z-index: 10000;
      max-width: min(340px, calc(100vw - 24px));
      padding: 12px 15px;
      background: rgba(28, 28, 30, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.78);
      pointer-events: none;
      white-space: pre-line;
      letter-spacing: -0.01em;
    }

    .app-tooltip[hidden] {
      display: none !important;
    }

    .chart-commit-tooltip {
      position: fixed;
      z-index: 10001;
      max-width: min(360px, calc(100vw - 24px));
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s var(--ease-out);
    }

    .chart-commit-tooltip,
    .chart-commit-tooltip * {
      pointer-events: none;
    }

  <script>
    'use strict';
    (function () {

      const styledTooltip = (function createStyledTooltip() {
        const el = document.createElement('div');
        el.className = 'app-tooltip';
        el.hidden = true;
        el.setAttribute('role', 'tooltip');
        document.body.appendChild(el);

        const showDelay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 260;
        let anchor = null;
        let showTimer = null;

        function position() {
          if (!anchor || el.hidden) return;

          const margin = 10;
          const rect = anchor.getBoundingClientRect();
          el.hidden = false;
          const tipRect = el.getBoundingClientRect();

          let top = rect.bottom + margin;
          let left = rect.left + (rect.width / 2) - (tipRect.width / 2);

          if (top + tipRect.height > window.innerHeight - margin) {
            top = rect.top - tipRect.height - margin;
          }
          if (top < margin) {
            top = margin;
          }

          left = Math.max(margin, Math.min(left, window.innerWidth - tipRect.width - margin));
          el.style.left = left + 'px';
          el.style.top = top + 'px';
        }

        function hide() {
          if (showTimer) {
            clearTimeout(showTimer);
            showTimer = null;
          }
          anchor = null;
          el.hidden = true;
          window.removeEventListener('scroll', position, true);
          window.removeEventListener('resize', position);
        }

        function show(target, text) {
          if (!text) return;
          hide();
          anchor = target;
          el.textContent = text;
          el.hidden = false;
          position();
          window.addEventListener('scroll', position, true);
          window.addEventListener('resize', position);
        }

        function bind(target, getText) {
          const resolve = () => (typeof getText === 'function' ? getText() : getText);

          const scheduleShow = () => {
            if (showTimer) clearTimeout(showTimer);
            showTimer = setTimeout(() => show(target, resolve()), showDelay);
          };

          if (target.hasAttribute('title')) {
            target.dataset.styledTooltip = target.getAttribute('title');
            target.removeAttribute('title');
          }

          target.addEventListener('mouseenter', scheduleShow);
          target.addEventListener('mouseleave', hide);
          target.addEventListener('focus', scheduleShow);
          target.addEventListener('blur', hide);
        }

        return { bind, hide };
      })();

      const chartCommitTooltip = (function createChartCommitTooltip() {
        const root = document.createElement('div');
        root.className = 'chart-commit-tooltip';
        root.hidden = true;
        root.setAttribute('role', 'tooltip');
        root.innerHTML = '<div class="chart-commit-tooltip__inner"></div>';
        document.body.appendChild(root);
        const inner = root.querySelector('.chart-commit-tooltip__inner');
        let activeChart = null;

        function hide() {
          activeChart = null;
          root.hidden = true;
          root.classList.remove('is-visible');
          window.removeEventListener('scroll', reposition, true);
          window.removeEventListener('resize', reposition);
        }

        function reposition() {
          if (!activeChart || root.hidden) return;
          const model = activeChart._activeCommitTooltip;
          if (!model) return;
          place(activeChart, model);
        }

        function place(chart, tooltipModel) {
          const rect = chart.canvas.getBoundingClientRect();
          const margin = 12;
          root.hidden = false;
          const tipRect = root.getBoundingClientRect();

          let left = rect.left + tooltipModel.caretX - (tipRect.width / 2);
          let top = rect.top + tooltipModel.caretY + 14;

          if (top + tipRect.height > window.innerHeight - margin) {
            top = rect.top + tooltipModel.caretY - tipRect.height - 14;
          }
          if (top < margin) top = margin;
          left = Math.max(margin, Math.min(left, window.innerWidth - tipRect.width - margin));

          root.style.left = left + 'px';
          root.style.top = top + 'px';
        }

        function resolveTooltipIndex(tooltipModel, chart) {
          const fromPoint = tooltipModel.dataPoints?.[0]?.index;
          if (fromPoint != null) return fromPoint;
          if (Number.isInteger(tooltipModel.index)) return tooltipModel.index;
          const active = chart.tooltip?._active;
          if (active?.length && active[0]._index != null) return active[0]._index;
          return null;
        }

        function showAt({ chart, dataset, meta, color, index }) {
          const row = dataset[index];
          if (!row) {
            hide();
            return;
          }

          const point = chart.getDatasetMeta(0)?.data[index];
          if (!point?._view) {
            hide();
            return;
          }

          inner.innerHTML = buildChartCommitTooltipHtml(
            row,
            meta,
            color,
            chartTooltipValueLabel(row),
          );

          const model = {
            opacity: 1,
            caretX: point._view.x,
            caretY: point._view.y,
            index,
          };

          activeChart = chart;
          chart._activeCommitTooltip = model;
          root.hidden = false;
          place(chart, model);
          root.classList.add('is-visible');
          window.removeEventListener('scroll', reposition, true);
          window.removeEventListener('resize', reposition);
          window.addEventListener('scroll', reposition, true);
          window.addEventListener('resize', reposition);
        }

        function update(tooltipModel, chart, ctx) {
          if (!tooltipModel || tooltipModel.opacity <= 0) return;
          const index = resolveTooltipIndex(tooltipModel, chart);
          if (index == null) return;
          showAt({ chart, index, ...ctx });
        }

        return { update, showAt, hide };
      })();

      const appBenchOrder = ['processor_prepare', 'process_block', 'editor'];
      const buildBenchOrder = ['compile_benchmark_target'];

      const chartCommitTickRotation = 45;

      Chart.plugins.register({

      function chartTooltipCommitterUser(row) {

      }

      function appendOverviewLeadSep(parent) {

      function overviewLeadTooltip(analysis) {

        if (actionable.length === 0) return '';

        const lines = ['Changes vs the previous develop push.', ''];
        for (const item of actionable) {

          const suffix = hint ? ` (${hint})` : '';

      function runnerDriftTooltipText() {

          'Faster': 'Notable improvements in plugin metrics vs the previous push.',

      const deltaFlatThresholdPct = 0.05;

      function maxRunnerDriftPct(sentinelBenches) {

      function classifyAppVsRunner(delta, maxRunnerDrift) {

        const appAbs = Math.abs(delta.pct);
        if (appAbs > maxRunnerDrift + 3) return 'likely-code';
        if (appAbs <= maxRunnerDrift + 1) return 'likely-noise';
        return 'uncertain';

        if (kind === 'likely-noise') {

        if (kind === 'likely-noise') return 'May be CI noise';

      function deltaSeverityRank(delta) {

        const magRank = { noise: 1, notable: 2, alert: 3 }[mag] ?? 0;
        if (magRank === 0) return 0;
        return magRank * 1000 + Math.abs(delta.pct);

      function formatDeltaShort(delta) {
        if (!delta || delta.tone === 'flat') return '~0%';
        const arrow = delta.tone === 'slower' ? '↑' : '↓';

      function sortOverviewBenches(benches) {

      }

      function analyzeOverviewMetricsAtIndex(benches, runnerDriftMax, commitIndex) {
        const entries = [];
        for (const [benchName, data] of benches) {
          const meta = getBenchMeta(benchName);
          const delta = enrichDelta(computeDeltaAtIndex(data, commitIndex));
          const runnerKind = meta.kind === 'app'
            ? classifyAppVsRunner(delta, runnerDriftMax)
            : null;
          entries.push({
            benchName,
            meta,
            delta,
            runnerKind,
            severity: deltaSeverityRank(delta),
          });
        }

        const appEntries = entries.filter(entry => entry.meta.kind === 'app');
        const actionable = appEntries.filter(
          entry => entry.delta
            && (entry.delta.magnitude === 'notable' || entry.delta.magnitude === 'alert'),
        );
        const worstActionable = actionable.length > 0
          ? [...actionable].sort((a, b) => b.severity - a.severity)[0]
          : null;
        const primaryBench = worstActionable?.benchName ?? null;
        const secondaryBenches = new Set(
          actionable
            .filter(entry => entry.benchName !== primaryBench)
            .map(entry => entry.benchName),
        );

        let verdictKind = 'ok';
        if (!entries.some(entry => entry.delta)) {
          verdictKind = 'no-baseline';
        } else if (actionable.length === 0) {
          verdictKind = 'ok';
        } else {
          const codeCount = actionable.filter(entry => entry.runnerKind === 'likely-code').length;
          const noiseCount = actionable.filter(entry => entry.runnerKind === 'likely-noise').length;
          if (codeCount > 0 && noiseCount === 0) {
            verdictKind = 'investigate-code';
          } else if (noiseCount > 0 && codeCount === 0) {
            verdictKind = 'investigate-noise';
          } else if (codeCount > 0 || noiseCount > 0) {
            verdictKind = 'investigate-mixed';
          } else {
            verdictKind = 'investigate-uncertain';
          }
        }

        return {
          entries,
          primaryBench,
          secondaryBenches,
          actionable,
          worstActionable,
          verdictKind,
          runnerDriftMax,
        };
      }

      function analyzeOverviewMetrics(benches, runnerDriftMax) {
        const [, data] = benches[0] ?? [];
        const commitIndex = data?.length ? data.length - 1 : 0;
        return analyzeOverviewMetricsAtIndex(benches, runnerDriftMax, commitIndex);
      }

      function resolveVerdictCopy(analysis) {
        const { verdictKind, actionable, worstActionable } = analysis;

        if (verdictKind === 'no-baseline') {
          return { tone: 'neutral', status: 'No baseline yet' };
        }

        if (verdictKind === 'ok') {
          return { tone: 'ok', status: 'Stable' };
        }

        const allFaster = actionable.every(entry => entry.delta.tone === 'faster');
        if (allFaster) {
          return { tone: 'ok', status: 'Faster' };
        }

        const statusByKind = {
          'investigate-code': 'Likely regression',
          'investigate-noise': 'Probably CI noise',
          'investigate-mixed': 'Mixed signal',
          'investigate-uncertain': 'Worth checking',
        };

        const toneByKind = {
          'investigate-code': 'alert',
          'investigate-noise': 'watch',
          'investigate-mixed': 'watch',
          'investigate-uncertain': 'watch',
        };

        return {
          tone: toneByKind[verdictKind] || 'neutral',
          status: statusByKind[verdictKind] || '',
        };
      }

      function shortSentinelLabel(meta) {
        return meta.label.replace(/^Reference\s+/i, '');
      }

      function formatBenchValue(valueNs) {
        if (!Number.isFinite(valueNs)) return null;
        const abs = Math.abs(valueNs);
        if (abs >= 1e9) return (valueNs / 1e9).toFixed(2) + ' s';
        if (abs >= 1e6) return (valueNs / 1e6).toFixed(1) + ' ms';
        if (abs >= 1e3) return (valueNs / 1e3).toFixed(1) + ' µs';
        return valueNs.toFixed(0) + ' ns';
      }

      function formatCompactBenchParts(valueNs, meta) {
        if (!Number.isFinite(valueNs)) return { num: 'n/a', unit: '' };
        const abs = Math.abs(valueNs);
        if (meta.kind === 'build') {
          if (abs >= 1e9) {
            const n = valueNs / 1e9;
            return { num: n.toFixed(abs >= 10e9 ? 0 : 1), unit: ' s' };
          }
        }
        if (abs >= 1e9) return { num: (valueNs / 1e9).toFixed(1), unit: ' s' };
        if (abs >= 1e6) {
          const n = valueNs / 1e6;
          return { num: n.toFixed(abs >= 10e6 ? 0 : 1), unit: ' ms' };
        }
        if (abs >= 1e3) return { num: (valueNs / 1e3).toFixed(0), unit: ' µs' };
        return { num: valueNs.toFixed(0), unit: ' ns' };
      }

      function formatCompactBenchValue(valueNs, meta) {
        const { num, unit } = formatCompactBenchParts(valueNs, meta);
        return num + unit;
      }

      /** Google Benchmark reports cpu_time in ns/iter; charts use ms for runtime, seconds for build. */
      function benchValueToChart(meta, valueNs) {
        if (meta.kind === 'build') return valueNs / 1e9;
        return valueNs / 1e6;
      }

      function chartYAxisLabel(meta, rawUnit) {
        if (meta.kind === 'build') return 's';
        return rawUnit === 'ns/iter' ? 'ms/iter' : (rawUnit || '');
      }

      function formatAxisMs(valueMs) {
        if (!Number.isFinite(valueMs)) return '';
        const abs = Math.abs(valueMs);
        if (abs >= 100) return valueMs.toFixed(0);
        if (abs >= 10) return valueMs.toFixed(1);
        if (abs >= 1) return valueMs.toFixed(1);
        return valueMs.toFixed(2);
      }

      function formatAxisSeconds(valueSec) {
        if (!Number.isFinite(valueSec)) return '';
        const abs = Math.abs(valueSec);
        if (abs >= 100) return valueSec.toFixed(0);
        if (abs >= 10) return valueSec.toFixed(1);
        return valueSec.toFixed(2);
      }

      function computeDeltaAtIndex(dataset, index) {
        if (!dataset || index < 1 || index >= dataset.length) return null;
        const latest = dataset[index].bench.value;
        const previous = dataset[index - 1].bench.value;
        if (!Number.isFinite(previous) || !Number.isFinite(latest) || previous === 0) return null;
        const pct = ((latest - previous) / previous) * 100;
        return {
          pct,
          latest,
          tone: Math.abs(pct) < deltaFlatThresholdPct ? 'flat' : pct > 0 ? 'slower' : 'faster',
        };
      }

      function computeVsPreviousDelta(dataset) {
        if (!dataset || dataset.length < 2) return null;
        return computeDeltaAtIndex(dataset, dataset.length - 1);
      }

      function deltaTooltipText(delta, kind, latestLabel, runnerNote = '') {
        if (!delta) return 'No previous commit to compare against yet.';

        const pctLabel = delta.tone === 'flat'
          ? 'About the same as the previous commit'
          : Math.abs(delta.pct).toFixed(1) + '% '
          + (delta.tone === 'slower' ? 'higher' : 'lower')
          + ' than the previous commit';

        let magnitudeLine = '';
        if (delta.magnitude === 'noise') {
          magnitudeLine = '\n\nWithin typical CI noise band';
        } else if (delta.magnitude === 'notable') {
          magnitudeLine = '\n\nModerate change';
        } else if (delta.magnitude === 'alert') {
          magnitudeLine = '\n\nLarge change — worth investigating';
        }

        const header = latestLabel ? latestLabel + '\n' : '';
        const runnerLine = runnerNote ? '\n\n' + runnerNote.trim() : '';

        if (kind === 'sentinel') {
          return header
            + pctLabel
            + magnitudeLine
            + '\n\nSynthetic host check — not Scyclone code'
            + '\nUse to interpret plugin metric shifts.'
            + runnerLine;
        }

        return header + pctLabel + magnitudeLine + runnerLine;
      }

      function applyDeltaChangeSpan(change, delta, baseClass = 'metric-delta', { neutral = false } = {}) {
        if (!delta) {
          change.className = baseClass + ' flat';
          change.textContent = '—';
          return;
        }
        if (delta.tone === 'flat') {
          change.className = baseClass + ' flat';
          change.textContent = '~0%';
          return;
        }

        const magnitude = delta.magnitude ?? classifyDeltaMagnitude(delta.pct);
        const worse = delta.tone === 'slower';
        const classes = [baseClass];

        if (neutral) {
          classes.push('neutral');
        } else if (magnitude === 'noise') {
          classes.push('noise');
        } else if (magnitude === 'notable') {
          classes.push('notable', worse ? 'up' : 'down');
        } else {
          classes.push(worse ? 'up' : 'down');
        }

        change.className = classes.join(' ');
        change.textContent = (worse ? '↗' : '↘') + ' ' + Math.abs(delta.pct).toFixed(1) + '%';
      }

      function createDeltaChangeSpan(delta, baseClass = 'metric-delta', { neutral = false } = {}) {
        const change = document.createElement('span');
        applyDeltaChangeSpan(change, delta, baseClass, { neutral });
        return change;
      }

      function updateKpiTileAtIndex(entry, commitIndex) {
        const {
          dataset,
          meta,
          numEl,
          unitEl,
          changeEl,
          deltaClass,
          tile,
        } = entry;
        if (!dataset || commitIndex < 0 || commitIndex >= dataset.length) return;

        const delta = enrichDelta(computeDeltaAtIndex(dataset, commitIndex));
        const value = dataset[commitIndex].bench.value;
        const valueParts = formatCompactBenchParts(delta?.latest ?? value, meta);

        numEl.textContent = valueParts.num;
        if (unitEl) {
          unitEl.textContent = valueParts.unit;
          unitEl.hidden = !valueParts.unit;
        }

        applyDeltaChangeSpan(changeEl, delta, deltaClass, { neutral: meta.kind === 'sentinel' });
        tile.classList.toggle(
          'metrics-alert',
          Boolean(delta?.magnitude === 'alert' && meta.kind === 'app'),
        );
      }

      updateOverviewKpiAtIndex = updateKpiTileAtIndex;

      function createKpiTile(
        benchName,
        dataset,
        colorIndex,
        {
          runnerDriftMax = 0,
          compact = false,
          rankPrimary = false,
        } = {},
      ) {
        const meta = getBenchMeta(benchName);
        const delta = enrichDelta(computeVsPreviousDelta(dataset));
        const latest = dataset.length > 0 ? dataset[dataset.length - 1].bench.value : null;
        const color = chartPalette[colorIndex % chartPalette.length];
        const valueParts = formatCompactBenchParts(delta?.latest ?? latest, meta);
        const deltaClass = compact ? 'kpi-col-delta' : 'kpi-delta';

        const tile = document.createElement('div');
        tile.className = compact ? 'kpi-col' : 'kpi-tile';
        tile.style.setProperty('--kpi-color', color);
        const tooltipText = benchInfoTooltipText(meta)
          + appVsRunnerNote(delta, runnerDriftMax);
        bindKpiNavigation(tile, benchName, tooltipText);

        let numEl = null;
        let unitEl = null;
        let changeEl = null;

        if (compact) {
          if (meta.kind === 'build') {
            tile.classList.add('kpi-col-build');
          }
          if (rankPrimary) {
            tile.classList.add('kpi-col-rank-primary');
          }

          const foot = document.createElement('div');
          foot.className = 'kpi-col-foot';

          const label = document.createElement('span');
          label.className = 'kpi-label';
          label.textContent = meta.kpiLabel || meta.label;
          foot.appendChild(label);
          tile.appendChild(foot);

          const valueRow = document.createElement('div');
          valueRow.className = 'kpi-col-value';

          const num = document.createElement('span');
          num.className = 'kpi-col-num';
          numEl = num;
          num.textContent = valueParts.num;
          valueRow.appendChild(num);

          if (valueParts.unit) {
            const unit = document.createElement('span');
            unit.className = 'kpi-col-unit';
            unitEl = unit;
            unit.textContent = valueParts.unit;
            valueRow.appendChild(unit);
          }

          tile.appendChild(valueRow);

          changeEl = createDeltaChangeSpan(
            delta,
            deltaClass,
            { neutral: meta.kind === 'sentinel' },
          );
          tile.appendChild(changeEl);
        } else {
          const head = document.createElement('div');
          head.className = 'kpi-head';

          const label = document.createElement('span');
          label.className = 'kpi-label';
          label.textContent = meta.label;
          head.appendChild(label);
          tile.appendChild(head);

          const body = document.createElement('div');
          body.className = 'kpi-body';

          const change = createDeltaChangeSpan(
            delta,
            deltaClass,
            { neutral: meta.kind === 'sentinel' },
          );
          body.appendChild(change);

          const value = document.createElement('span');
          value.className = 'kpi-value';
          value.textContent = formatCompactBenchValue(delta?.latest ?? latest, meta);
          body.appendChild(value);

          tile.appendChild(body);
        }

        if (delta && delta.magnitude === 'alert' && meta.kind === 'app') {
          tile.classList.add('metrics-alert');
        }

        if (compact) {
          chartSync.registerKpi({
            tile,
            benchName,
            overview: true,
            dataset,
            meta,
            numEl,
            unitEl,
            changeEl,
            deltaClass,
          });
        } else {
          chartSync.registerKpi({ tile, benchName });
        }

        return { tile, color };
      }

      function createKpiPanel(
        benches,
        startColorIndex,
        {
          runnerDriftMax = 0,
          panelLabel = null,
          overview = false,
          overviewAnalysis = null,
        } = {},
      ) {
        const panel = document.createElement('div');
        panel.className = 'kpi-panel';

        if (panelLabel) {
          const label = document.createElement('p');
          label.className = 'kpi-panel-label';
          label.textContent = panelLabel;
          panel.appendChild(label);
        }

        const orderedBenches = overview ? sortOverviewBenches(benches) : benches;

        const grid = document.createElement('div');
        grid.className = overview ? 'kpi-strip' : 'kpi-grid';
        if (overview) {
          const hasBuild = orderedBenches.some(([benchName]) => getBenchMeta(benchName).kind === 'build');
          if (hasBuild) {
            grid.classList.add('kpi-strip--grouped');
          }
        }
        grid.setAttribute(
          'aria-label',
          overview ? 'Benchmark change vs previous develop push' : 'Latest benchmark summary',
        );

        const stripWrap = overview ? document.createElement('div') : null;
        if (stripWrap) {
          stripWrap.className = 'kpi-strip-card';
          stripWrap.appendChild(grid);
          panel.appendChild(stripWrap);
        } else {
          panel.appendChild(grid);
        }

        const colors = new Map();
        let colorIndex = startColorIndex;
        for (const [benchName, data] of orderedBenches) {
          const rankPrimary = overviewAnalysis?.primaryBench === benchName
            && getBenchMeta(benchName).kind !== 'build';
          const { tile, color } = createKpiTile(benchName, data, colorIndex++, {
            runnerDriftMax,
            compact: overview,
            rankPrimary,
          });
          colors.set(benchName, color);
          grid.appendChild(tile);
        }

        return { panel, colors, nextColorIndex: colorIndex };
      }

      function createBaselineSummaryDrift(sentinelBenches) {
        const wrap = document.createElement('span');
        wrap.className = 'baseline-summary-drift';

        sentinelBenches.forEach(([benchName, data], index) => {
          if (index > 0) {
            wrap.appendChild(document.createTextNode(' · '));
          }
          const meta = getBenchMeta(benchName);
          const delta = enrichDelta(computeVsPreviousDelta(data));
          wrap.appendChild(document.createTextNode(shortSentinelLabel(meta) + ' '));
          wrap.appendChild(createDeltaChangeSpan(delta, 'kpi-delta', { neutral: true }));
        });

        return wrap;
      }

      function createSectionHeader(title) {
        const header = document.createElement('div');
        header.className = 'section-header';
        const heading = document.createElement('h2');
        heading.textContent = title;
        header.appendChild(heading);
        return header;
      }

      function collectBenchesPerTestCase(entries) {
        const map = new Map();
        for (const entry of entries) {
          const { commit, date, tool, benches } = entry;
          for (const bench of benches) {
            const result = { commit, date, tool, bench };
            const arr = map.get(bench.name);
            if (arr === undefined) map.set(bench.name, [result]);
            else arr.push(result);
          }
        }
        return map;
      }

      function init() {
        const data = window.BENCHMARK_DATA;
        const methodologyTip = document.getElementById('methodology-tip');
        styledTooltip.bind(
          methodologyTip,
          'How these benchmarks are measured\n\n'
          + 'Plugin performance\n'
          + 'macOS arm64 CI · 44.1 kHz · 512 samples\n'
          + 'Prepare, Process, Editor\n'
          + 'Each point = mean of 5 repetitions\n\n'
          + 'Build\n'
          + 'Wall-clock Release build of the Benchmark target\n'
          + 'Measured once per CI run',
        );

        document.getElementById('last-update').textContent =
          new Date(data.lastUpdate).toLocaleString(undefined, {
            day: 'numeric',
            month: 'short',
            year: 'numeric',
          });
        const repoLink = document.getElementById('repository-link');
        repoLink.href = data.repoUrl;
        repoLink.textContent = 'GitHub';

        document.getElementById('dl-button').onclick = () => {
          const a = document.createElement('a');
          a.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(data, null, 2));
          a.download = 'benchmark_data.json';
          a.click();
        };

        return Object.keys(data.entries).map(name => ({
          name,
          dataSet: collectBenchesPerTestCase(data.entries[name]),
        }));
      }

      function sortBenches(entries, order) {
        return [...entries].sort((a, b) => {
          const ia = order.indexOf(benchKey(a[0]));
          const ib = order.indexOf(benchKey(b[0]));
          const ai = ia === -1 ? order.length : ia;
          const bi = ib === -1 ? order.length : ib;
          return ai - bi;
        });
      }

      function partitionBenches(benchSet) {
        const app = [];
        const build = [];
        const sentinel = [];
        for (const entry of benchSet.entries()) {
          const kind = getBenchMeta(entry[0]).kind;
          if (kind === 'sentinel') sentinel.push(entry);
          else if (kind === 'build') build.push(entry);
          else app.push(entry);
        }
        return {
          app: sortBenches(app, appBenchOrder),
          build: sortBenches(build, buildBenchOrder),
          sentinel: sortBenches(sentinel, sentinelBenchOrder),
        };
      }

      function createChartBlock(name, color) {
        const meta = getBenchMeta(name);
        const block = document.createElement('div');
        block.className = 'chart-block';
        block.id = benchChartId(name);
        block.setAttribute('aria-label', meta.label + ' trend');
        block.style.setProperty('--chart-color', color);
        chartAnchors.set(name, block);

        const header = document.createElement('div');
        header.className = 'chart-header';
        block.appendChild(header);

        const titleRow = document.createElement('div');
        titleRow.className = 'chart-title-row';

        const label = document.createElement('h3');
        label.className = 'chart-label';
        label.textContent = meta.label;
        titleRow.appendChild(label);

        if (meta.tooltip) {
          const tip = document.createElement('button');
          tip.type = 'button';
          tip.className = 'info-tip';
          tip.textContent = '?';
          tip.setAttribute('aria-label', meta.label + ': ' + meta.tooltip);
          styledTooltip.bind(tip, meta.tooltip);
          titleRow.appendChild(tip);
        }

        header.appendChild(titleRow);

        const canvas = document.createElement('canvas');
        canvas.className = 'benchmark-chart';
        block.appendChild(canvas);

        return { block, canvas, meta };
      }

      function createBuildSectionHeader(buildBenches) {
        const header = document.createElement('div');
        header.className = 'section-header';

        const heading = document.createElement('h2');
        heading.textContent = 'Build';
        header.appendChild(heading);

        if (buildBenches.length > 0) {
          const [, data] = buildBenches[0];
          const meta = getBenchMeta(buildBenches[0][0]);
          const delta = enrichDelta(computeVsPreviousDelta(data));
          const latest = data.length > 0 ? data[data.length - 1].bench.value : null;
          const summary = document.createElement('span');
          summary.className = 'build-summary-delta';
          summary.appendChild(document.createTextNode(
            'Compile ' + formatCompactBenchValue(delta?.latest ?? latest, meta) + ' ',
          ));
          summary.appendChild(createDeltaChangeSpan(delta, 'kpi-delta'));
          header.appendChild(summary);
        }

        return header;
      }

      function mergeOverviewBenches(app, build) {
        return [...sortOverviewBenches(app), ...sortBenches(build, buildBenchOrder)];
      }

      function initChart(canvas, meta, dataset, color, block, benchName) {
        const yUnit = chartYAxisLabel(meta, dataset.length > 0 ? dataset[0].bench.unit : '');
        const chartData = {
          labels: dataset.map(d => d.commit.id.slice(0, 7)),
          datasets: [{
            label: meta.label,
            data: dataset.map(d => benchValueToChart(meta, d.bench.value)),
            borderColor: color,
            backgroundColor: chartFillColor(color),
            borderWidth: 2.5,
            pointBackgroundColor: color,
            pointBorderColor: '#111111',
            pointBorderWidth: 1,
            pointRadius: 0,
            pointHoverRadius: 7,
            fill: true,
            lineTension: 0.3,
          }],
        };

        const chart = new Chart(canvas, {
          type: 'line',
          data: chartData,
          options: {
            legend: { display: false },
            maintainAspectRatio: true,
            aspectRatio: chartAspectRatio(),
            layout: {
              padding: {
                bottom: chartCommitTickPadding,
              },
            },
            elements: {
              point: { hitRadius: 12 },
              line: { borderJoinStyle: 'round' },
            },
            hover: {
              mode: 'index',
              intersect: false,
              animationDuration: 0,
            },
            scales: {
              xAxes: [{
                gridLines: {
                  color: chartTheme.grid,
                  zeroLineColor: chartTheme.grid,
                  drawBorder: false,
                },
                ticks: commitTickAxisOptions(),
              }],
              yAxes: [{
                gridLines: {
                  color: chartTheme.grid,
                  zeroLineColor: chartTheme.grid,
                  drawBorder: false,
                },
                ticks: {
                  fontColor: chartTheme.tick,
                  fontFamily: 'Inter',
                  fontSize: 11,
                  beginAtZero: true,
                  callback: value => meta.kind === 'build'
                    ? formatAxisSeconds(value)
                    : formatAxisMs(value),
                },
                scaleLabel: {
                  display: true,
                  labelString: yUnit,
                  fontColor: chartTheme.label,
                  fontFamily: 'Inter',
                  fontSize: 11,
                },
              }],
            },
            tooltips: {
              enabled: false,
              mode: 'index',
              intersect: false,
              custom(tooltipModel) {
                chartCommitTooltip.update(tooltipModel, this, { dataset, meta, color });
              },
            },
            onClick(_evt, active) {
              if (active.length === 0) return;
              const url = dataset[active[0]._index].commit.url;
              if (url) window.open(url, '_blank');
            },
            onHover(_evt, active) {
              if (active.length === 0) return;
              const index = active[0]._index;
              chartSync.setMetricHover(benchName);
              chartSync.setCommitHover(dataset[index].commit.id);
              chartCommitTooltip.showAt({
                chart: this,
                dataset,
                meta,
                color,
                index,
              });
            },
          },
        });

        configureCommitAxisTicks(chart, chart.data.labels, false);
        chart.update(0);
        chartSync.registerChart({ chart, dataset, baseColor: color, block, benchName });
        return chart;
      }

      function renderGraphs(parent, benches, startColorIndex, colorMap = null) {
        let colorIndex = startColorIndex;
        for (const [benchName, data] of benches) {
          const color = colorMap?.get(benchName) ?? chartPalette[colorIndex % chartPalette.length];
          const { block, canvas, meta } = createChartBlock(benchName, color);
          parent.appendChild(block);
          initChart(canvas, meta, data, color, block, benchName);
          colorIndex++;
        }
        return colorIndex;
      }

      function renderBenchSet(benchSet, main) {
        const { app, build, sentinel } = partitionBenches(benchSet);
        let colorIndex = 0;
        const runnerDriftMax = sentinel.length > 0 ? maxRunnerDriftPct(sentinel) : 0;
        const overview = mergeOverviewBenches(app, build);
        let sharedColors = new Map();

        const foldPrimary = document.createElement('div');
        foldPrimary.className = 'fold-primary';
        main.appendChild(foldPrimary);

        if (overview.length > 0) {
          const overviewBlock = document.createElement('div');
          overviewBlock.className = 'overview-block';
          foldPrimary.appendChild(overviewBlock);

          const overviewLayout = document.createElement('div');
          overviewLayout.className = 'overview-layout';
          overviewBlock.appendChild(overviewLayout);

          const overviewAnalysis = analyzeOverviewMetrics(overview, runnerDriftMax);

          const metricsGroup = document.createElement('div');
          metricsGroup.className = 'overview-metrics';
          overviewLayout.appendChild(metricsGroup);

          const { panel, colors, nextColorIndex } = createKpiPanel(overview, colorIndex, {
            runnerDriftMax,
            overview: true,
            overviewAnalysis,
          });
          metricsGroup.appendChild(panel);

          const contextStrip = createOverviewContextStrip(sentinel, overviewAnalysis, overview);
          if (contextStrip) {
            metricsGroup.appendChild(contextStrip.line);
          }

          chartSync.registerOverview({ contextStrip });

          sharedColors = colors;
          colorIndex = nextColorIndex;
        }

        if (app.length > 0) {
          const section = document.createElement('section');
          section.className = 'content-section';
          foldPrimary.appendChild(section);
          section.appendChild(createSectionHeader('Plugin performance'));

          const graphsElem = document.createElement('div');
          graphsElem.className = 'benchmark-graphs';
          section.appendChild(graphsElem);
          colorIndex = renderGraphs(graphsElem, app, colorIndex - overview.length, sharedColors);
        }

        if (build.length > 0) {
          const section = document.createElement('section');
          section.className = 'content-section content-section--build';
          main.appendChild(section);
          section.appendChild(createBuildSectionHeader(build));

          const graphsElem = document.createElement('div');
          graphsElem.className = 'benchmark-graphs';
          section.appendChild(graphsElem);
          colorIndex = renderGraphs(graphsElem, build, colorIndex - build.length, sharedColors);
        }

        if (sentinel.length > 0) {
          const details = document.createElement('details');
          details.className = 'content-section baseline-section';

          const summary = document.createElement('summary');
          const summaryTitle = document.createElement('div');
          summaryTitle.className = 'baseline-summary-text';
          summaryTitle.innerHTML = '<h2>Runner baseline</h2>';
          const runnerEnv = document.createElement('p');
          runnerEnv.className = 'baseline-runner-env';
          runnerEnv.textContent = 'macOS arm64 · 44.1 kHz / 512 samples';
          summaryTitle.appendChild(runnerEnv);
          summary.appendChild(summaryTitle);

          const summaryActions = document.createElement('div');
          summaryActions.className = 'baseline-summary-actions';
          summaryActions.appendChild(createBaselineSummaryDrift(sentinel));
          const chevron = document.createElement('span');
          chevron.className = 'baseline-chevron';
          chevron.setAttribute('aria-hidden', 'true');
          chevron.textContent = '▸';
          summaryActions.appendChild(chevron);
          summary.appendChild(summaryActions);
          details.appendChild(summary);

          const body = document.createElement('div');
          body.className = 'baseline-body';
          details.appendChild(body);

          const { panel, colors } = createKpiPanel(sentinel, 0, {
            panelLabel: 'Synthetic host checks — compare drift to Scyclone metrics above',
          });
          body.appendChild(panel);

          const graphsElem = document.createElement('div');
          graphsElem.className = 'benchmark-graphs';
          body.appendChild(graphsElem);

          const pending = sentinel.map(([benchName, data]) => {
            const color = colors.get(benchName);
            const { block, canvas, meta } = createChartBlock(benchName, color);
            graphsElem.appendChild(block);
            return { block, canvas, meta, data };
          });

          let baselineReady = false;
          function drawBaselineCharts() {
            if (baselineReady) return;
            baselineReady = true;
            pending.forEach((item, index) => {
              const [benchName] = sentinel[index];
              const color = colors.get(benchName);
              initChart(item.canvas, item.meta, item.data, color, item.block, benchName);
            });
          }

          details.addEventListener('toggle', () => {
            if (details.open) drawBaselineCharts();
          });

          main.appendChild(details);
        }
      }

      function syncFoldPrimaryMinHeight() {
        const fold = document.querySelector('.fold-primary');
        if (!fold) return;
        const top = fold.getBoundingClientRect().top;
        if (!Number.isFinite(top) || top < 0) return;
        const buffer = 32;
        fold.style.minHeight = `calc(100dvh - ${Math.ceil(top)}px + ${buffer}px)`;
      }

      const main = document.getElementById('main');
      main.addEventListener('mouseleave', () => {
        chartSync.clearAll();
        styledTooltip.hide();
        chartCommitTooltip.hide();
      });
      let chartResizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(chartResizeTimer);
        chartResizeTimer = setTimeout(() => {
          chartSync.resizeCharts();
          syncFoldPrimaryMinHeight();
        }, 150);
      });
      for (const { dataSet } of init()) {
        renderBenchSet(dataSet, main);
      }
      requestAnimationFrame(() => {
        requestAnimationFrame(syncFoldPrimaryMinHeight);
      });
    })();
  </script>
</body>

</html>
