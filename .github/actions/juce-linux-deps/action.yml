name: JUCE Linux dependencies
description: System packages required to build juceaide and JUCE GUI modules on Ubuntu CI runners

runs:
  using: composite
  steps:
    - name: Install JUCE Linux dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libfreetype6-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxinerama-dev \
          libxrandr-dev \
          libglu1-mesa-dev \
          libcurl4-openssl-dev \
          libwebkit2gtk-4.0-dev
