name: Benchmark

# Triggers: develop only. Do not add push triggers for other branches
# without revisiting job concurrency (develop pushes use benchmark-gh-pages).
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.event_name == 'push' && 'benchmark-gh-pages' || format('benchmark-{0}', github.event.pull_request.number || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  BUILD_TYPE: Release
  BUILD_DIR: build

jobs:
  benchmark-pr:
    if: github.event_name == 'pull_request'
    name: benchmark (macOS)
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: get repo and submodules
        uses: actions/checkout@v6
        with:
          submodules: true

      - uses: ./.github/actions/setup-macos-juce
        with:
          install_osxutils: 'false'

      - uses: ./.github/actions/set-parallel-build-level

      - name: restore FetchContent cache
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/setup_tests_and_benchmarks.cmake') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-

      - name: cmake configure
        shell: bash
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: cmake build Benchmark
        id: build_benchmark
        shell: bash
        run: |
          start=$(perl -MTime::HiRes=time -e 'print time')
          cmake --build build --target Benchmark --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}
          elapsed_sec=$(perl -MTime::HiRes=time -e "print time - $start")
          echo "elapsed_sec=${elapsed_sec}" >> "$GITHUB_OUTPUT"
          echo "Compile time (Benchmark target): ${elapsed_sec}s"

      - name: run benchmarks
        run: |
          ./build/Benchmark \
            --benchmark_out=benchmark_result.json \
            --benchmark_out_format=json \
            --benchmark_repetitions=5 \
            --benchmark_min_time=2.0s \
            --benchmark_report_aggregates_only=true \
            --benchmark_display_aggregates_only=true \
            --benchmark_enable_random_interleaving=false

      - name: append compile time to benchmark results
        shell: bash
        run: |
          elapsed_sec="${{ steps.build_benchmark.outputs.elapsed_sec }}"
          elapsed_ns=$(awk "BEGIN {printf \"%.0f\", ${elapsed_sec} * 1e9}")
          jq --argjson ns "$elapsed_ns" '
            .benchmarks += [{
              "name": "BM_compile_benchmark_target/min_time:2.000_mean",
              "family_index": 99,
              "per_family_instance_index": 0,
              "run_name": "BM_compile_benchmark_target/min_time:2.000",
              "run_type": "aggregate",
              "repetitions": 1,
              "threads": 1,
              "aggregate_name": "mean",
              "aggregate_unit": "time",
              "iterations": 1,
              "real_time": $ns,
              "cpu_time": $ns,
              "time_unit": "ns"
            }]
          ' benchmark_result.json > benchmark_result.tmp.json
          mv benchmark_result.tmp.json benchmark_result.json

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-macos-${{ github.sha }}
          path: benchmark_result.json
          retention-days: 90

      - name: store benchmark results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: Scyclone macOS
          tool: googlecpp
          output-file-path: benchmark_result.json
          ref: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: false
          summary-always: true
          comment-on-alert: false
          fail-on-alert: false

      - name: benchmark dashboard link
        if: always()
        shell: bash
        run: |
          {
            echo "### Benchmark dashboard"
            echo ""
            echo "[View benchmark history](https://torsion-audio.github.io/Scyclone/dev/bench/)"
            echo ""
            echo "PR runs are read-only and show the step summary above."
          } >> "$GITHUB_STEP_SUMMARY"

  benchmark-push:
    if: github.event_name == 'push'
    name: benchmark (macOS)
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: get repo and submodules
        uses: actions/checkout@v6
        with:
          submodules: true

      - uses: ./.github/actions/setup-macos-juce
        with:
          install_osxutils: 'false'

      - uses: ./.github/actions/set-parallel-build-level

      - name: restore FetchContent cache
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/setup_tests_and_benchmarks.cmake') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-

      - name: cmake configure
        shell: bash
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: cmake build Benchmark
        id: build_benchmark
        shell: bash
        run: |
          start=$(perl -MTime::HiRes=time -e 'print time')
          cmake --build build --target Benchmark --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}
          elapsed_sec=$(perl -MTime::HiRes=time -e "print time - $start")
          echo "elapsed_sec=${elapsed_sec}" >> "$GITHUB_OUTPUT"
          echo "Compile time (Benchmark target): ${elapsed_sec}s"

      - name: run benchmarks
        run: |
          ./build/Benchmark \
            --benchmark_out=benchmark_result.json \
            --benchmark_out_format=json \
            --benchmark_repetitions=5 \
            --benchmark_min_time=2.0s \
            --benchmark_report_aggregates_only=true \
            --benchmark_display_aggregates_only=true \
            --benchmark_enable_random_interleaving=false

      - name: append compile time to benchmark results
        shell: bash
        run: |
          elapsed_sec="${{ steps.build_benchmark.outputs.elapsed_sec }}"
          elapsed_ns=$(awk "BEGIN {printf \"%.0f\", ${elapsed_sec} * 1e9}")
          jq --argjson ns "$elapsed_ns" '
            .benchmarks += [{
              "name": "BM_compile_benchmark_target/min_time:2.000_mean",
              "family_index": 99,
              "per_family_instance_index": 0,
              "run_name": "BM_compile_benchmark_target/min_time:2.000",
              "run_type": "aggregate",
              "repetitions": 1,
              "threads": 1,
              "aggregate_name": "mean",
              "aggregate_unit": "time",
              "iterations": 1,
