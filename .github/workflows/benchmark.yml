          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          summary-always: true
          comment-on-alert: false
          fail-on-alert: false

      - name: benchmark dashboard link
        if: always()
        shell: bash
        run: |
          {
            echo "### Benchmark dashboard"
            echo ""
            echo "[View benchmark history](https://torsion-audio.github.io/Scyclone/dev/bench/)"
            echo ""
            echo "Charts update on \`develop\` pushes; PR runs show the step summary above."
          } >> "$GITHUB_STEP_SUMMARY"
