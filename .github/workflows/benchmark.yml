            }]
          ' benchmark_result.json > benchmark_result.tmp.json
          mv benchmark_result.tmp.json benchmark_result.json

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-macos-${{ github.sha }}
          path: benchmark_result.json
